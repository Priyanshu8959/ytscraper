services:
  - type: web
    name: ytscraper
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run ytrag load && uv run uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: YTRAG_EMBED_MODEL
        value: all-MiniLM-L6-v2
      - key: GROQ_API_KEY
        sync: false
